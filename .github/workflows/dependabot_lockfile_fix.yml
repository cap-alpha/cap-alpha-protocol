name: Dependabot Lockfile Auto-Resolve

# When dependabot opens a PR that updates web/package.json but leaves
# web/package-lock.json out of sync (a known dependabot gap for new
# optional/platform-specific deps like @esbuild/*), this workflow runs
# `npm install --package-lock-only` on the PR branch and pushes the
# refreshed lockfile back, so frontend_preflight's `npm ci` succeeds.
#
# IMPORTANT: pushes made with the default GITHUB_TOKEN do NOT trigger
# other workflows. So the FIRST time this fires on a stale PR, preflight
# will already have failed. The lockfile push fixes the underlying state;
# manually re-run preflight or push a noop commit to clear the red.
# For future dependabot PRs the workflow can race-trigger before
# preflight does, which usually wins.
#
# To make the push retrigger preflight automatically, replace the token
# below with a fine-grained PAT stored as the `DEPENDABOT_FIX_PAT` secret
# (must have `contents: write` on this repo and the actor permission to
# trigger Actions).

on:
  pull_request:
    paths:
      - 'web/package.json'
      - 'web/package-lock.json'

permissions:
  contents: write

jobs:
  resolve:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.DEPENDABOT_FIX_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Refresh lockfile
        working-directory: ./web
        run: npm install --package-lock-only

      - name: Commit if lockfile changed
        run: |
          if git diff --quiet web/package-lock.json; then
            echo "Lockfile already in sync — nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package-lock.json
          git commit -m "chore(deps): resolve lockfile drift after dependabot update

          Auto-generated by .github/workflows/dependabot_lockfile_fix.yml.
          [dependabot skip]"
          git push
