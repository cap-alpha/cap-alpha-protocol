name: Production Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'pipeline/api/**'
    tags:
      - 'v*' # Also trigger on semantic version tags for manual versioned releases
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  production:
    name: Production Deploy (Vercel)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        working-directory: web
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        working-directory: web
        env:
          # Clerk SDK validates publishableKey format at build time (v5.7+).
          # This must be the real secret — production builds cannot use a placeholder.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          # Stripe initialises at module load time in billing API routes; a non-empty
          # placeholder allows `vercel build` to import those modules without throwing
          # "Neither apiKey nor config.authenticator provided". Real key used at runtime.
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY || 'sk_test_placeholder_for_ci_build' }}
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        id: deploy
        working-directory: web
        run: |
          PROD_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "Vercel Production URL: $PROD_URL"
          echo "prod_url=$PROD_URL" >> $GITHUB_OUTPUT

      - name: Alias cap-alpha.co to new deployment
        working-directory: web
        run: vercel alias set ${{ steps.deploy.outputs.prod_url }} cap-alpha.co --token=${{ secrets.VERCEL_TOKEN }}

      - name: Pre-warm edge cache (homepage + leaderboard API)
        # Curl both critical paths so the first real visitor gets cached HTML/JSON
        # instead of a cold-edge-cache miss hitting Cloud Run.
        # --fail-with-body (-f): treat 4xx/5xx as errors but still print body.
        # We use || true so a transient warm-up failure never blocks the deploy.
        run: |
          echo "=== Pre-warming homepage ==="
          curl -fsS -o /dev/null -w "homepage: %{time_total}s\n" \
            --max-time 30 \
            https://cap-alpha.co/ || echo "homepage warm-up failed (non-blocking)"

          echo "=== Pre-warming leaderboard API ==="
          curl -fsS -o /dev/null -w "leaderboard API: %{time_total}s\n" \
            --max-time 30 \
            "https://cap-alpha.co/api/ledger/pundits?limit=20&sort=accuracy" || echo "leaderboard API warm-up failed (non-blocking)"
