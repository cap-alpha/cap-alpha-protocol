name: Pundit Prediction Pipeline

on:
  schedule:
    # Run every 30 minutes during active hours (8am-midnight EDT = 12:00-04:00 UTC; shifts 1h in EST)
    - cron: '3,33 12-23,0-4 * * *'
    # Run every 2 hours during off-hours
    - cron: '3 5-11 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max articles to extract per run'
        required: false
        default: '50'

# Serialize concurrent scheduled runs so only one pipeline ingest is active at
# a time.  cancel-in-progress: false ensures a slow run is never killed mid-
# chain; the next scheduled run queues behind it instead.
# The application-level optimistic-concurrency guard (ledger_chain_head MERGE)
# provides a second safety layer for manual runs that bypass this lock.
concurrency:
  group: pundit-pipeline
  cancel-in-progress: false

jobs:
  ingest-extract-resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write  # Required for Workload Identity Federation OIDC token request

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        id: install_deps
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip setuptools wheel
          # Pre-pin numpy/pandas before bulk install so the resolver picks binary wheels.
          # pandas-gbq requires pandas>=1.5.3; without this, pip resolves to 1.5.3
          # which has no py312 binary wheel (source build fails on pkg_resources).
          .venv/bin/pip install "numpy>=1.26" "pandas>=2.0"
          # Bulk install — nfl-data-py excluded here because its pandas<2.0 constraint
          # would force the resolver back to a source-only pandas version.
          grep -v "nfl-data-py" pipeline/requirements.txt | .venv/bin/pip install --prefer-binary -r /dev/stdin
          # Install nfl-data-py last with --no-deps to skip its stale pandas<2.0 pin.
          .venv/bin/pip install --no-deps "nfl-data-py>=0.3.3"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Authenticate to GCP (Workload Identity)
        # Preferred path: workload identity federation — no key file written to disk.
        # Falls back to JSON key if vars.WORKLOAD_IDENTITY_PROVIDER is not configured.
        # See GCP setup instructions in issue #709.
        id: auth_wif
        if: vars.WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Authenticate to GCP (JSON key fallback)
        # Legacy fallback used until the Workload Identity Pool is provisioned.
        # Writes the key to a temp file that is cleaned up in the Cleanup step.
        # Shell injection risk is mitigated by single-quoting the expansion so
        # the shell never interprets the JSON content.
        id: auth_json
        if: vars.WORKLOAD_IDENTITY_PROVIDER == ''
        run: |
          echo '${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}' > /tmp/gcp-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json" >> $GITHUB_ENV

      - name: Apply pending migrations
        id: apply_migrations
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          PYTHONPATH: ${{ github.workspace }}/pipeline
          GITHUB_SHA: ${{ github.sha }}
        run: |
          cd pipeline
          python3 scripts/apply_migrations.py

      - name: Ingest new articles
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          PYTHONPATH: ${{ github.workspace }}/pipeline
          # Powers the 6 `youtube_data_api` sources (media_sources.yaml). If unset,
          # fetch_youtube_data_api() logs a warning and returns [] per source rather
          # than failing the run — see media_ingestor.py. Andrew: add this repo
          # secret to actually pull YouTube content (see PR description).
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          cd pipeline
          python3 -m src.media_ingestor

      - name: Seed pundit registry
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          PYTHONPATH: ${{ github.workspace }}/pipeline
        run: |
          cd pipeline
          python3 -m scripts.seed_pundit_registry

      - name: Extract predictions
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Explicitly override the yaml-default (Ollama) to Gemini for CI runs.
          # llm_config.yaml stays Ollama-first so local dev remains offline-capable.
          LLM_EXTRACTION_PROVIDER: gemini
          LLM_EXTRACTION_MODEL: gemini-3-flash-preview
          PYTHONPATH: ${{ github.workspace }}/pipeline
          # CI provenance — written to silver_v2_claims.extraction_run by run_extraction()
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          cd pipeline
          # Precedence: manual workflow_dispatch input > repo variable EXTRACTION_LIMIT
          # (settable without a code change — lever for the Gemini free-tier 20 req/day
          # cap) > hardcoded default. run_extraction() also now stops the batch as soon
          # as it sees one RESOURCE_EXHAUSTED/429 instead of burning the rest of --limit
          # on doomed calls (see _is_quota_exhausted_error in assertion_extractor.py).
          # The real fix for the quota ceiling is upgrading off the Gemini free tier —
          # see PR description.
          python3 -m src.assertion_extractor --limit ${{ github.event.inputs.limit || vars.EXTRACTION_LIMIT || '50' }} --include-unmatched

      - name: Verify extraction produced output
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          PYTHONPATH: ${{ github.workspace }}/pipeline
        run: |
          cd pipeline
          python3 scripts/check_extraction_health.py --window-minutes 120 --min-count 1

      - name: Refresh SportsDataIO draft data
        # H1 (incident review): gated like Resolve below, NOT behind the extraction
        # verify step. Resolve grades draft_pick/fa_signing/game_outcome against
        # bronze_sportsdataio_* — on a quota/verify-fail day this refresh must still
        # run, or Resolve grades stale roster/draft data and can emit false INCORRECTs.
        if: |
          !cancelled() &&
          steps.install_deps.outcome == 'success' &&
          steps.apply_migrations.outcome == 'success' &&
          steps.auth_wif.outcome != 'failure' &&
          steps.auth_json.outcome != 'failure'
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          SPORTS_DATA_IO_API_KEY: ${{ secrets.SPORTS_DATA_IO_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}/pipeline
        run: |
          cd pipeline
          python3 -c "from src.sportsdataio_client import ingest_bronze_players; ingest_bronze_players()"

      - name: Resolve predictions
        # Decoupled from the "Verify extraction produced output" gate above
        # (incident: pipeline-ingestion-recovery). Resolving already-PENDING
        # predictions does not depend on today's extraction succeeding — a
        # 0-utterance day (e.g. Gemini free-tier quota exhaustion) must not
        # also skip resolving predictions from prior days. Gated only on the
        # environment actually being usable (deps installed, GCP auth
        # succeeded/was applicable) so Resolve still has working GCP
        # creds/PYTHONPATH; NOT gated on Ingest/Seed/Extract/Verify outcome.
        if: |
          !cancelled() &&
          steps.install_deps.outcome == 'success' &&
          steps.apply_migrations.outcome == 'success' &&
          steps.auth_wif.outcome != 'failure' &&
          steps.auth_json.outcome != 'failure'
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          # #1131: make GEMINI_API_KEY available in the resolve step so the
          # grounded judge (llm_judge_silver, provider_override=gemini-flash) can
          # reach a model when it is wired into the cron. We intentionally do NOT
          # set LLM_EXTRACTION_PROVIDER here: that would activate the legacy
          # *ungrounded* parametric judge (get_provider role="extraction"), which
          # adversarial review flagged for unbounded re-judge churn (cost) and
          # scoring-metric pollution. Keep the legacy judge inert until it has a
          # per-run LLM-call cap + unresolvable marker, or resolutions route
          # through the grounded judge instead.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}/pipeline
        run: |
          cd pipeline
          python3 -m src.resolve_daily

      - name: Report status
        if: always()
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          PYTHONPATH: ${{ github.workspace }}/pipeline
        run: |
          cd pipeline
          python3 - <<'PY'
          from src.db_manager import DBManager
          db = DBManager()
          total = db.fetch_df('SELECT COUNT(*) as n FROM gold_layer.prediction_ledger')
          pending = db.fetch_df("SELECT COUNT(*) as n FROM gold_layer.prediction_ledger WHERE resolution_status = 'PENDING'")
          correct = db.fetch_df("SELECT COUNT(*) as n FROM gold_layer.prediction_resolutions WHERE resolution_status = 'CORRECT'")
          incorrect = db.fetch_df("SELECT COUNT(*) as n FROM gold_layer.prediction_resolutions WHERE resolution_status = 'INCORRECT'")
          print(f'Pipeline complete: {total.iloc[0]["n"]} total | {pending.iloc[0]["n"]} pending | {correct.iloc[0]["n"]} correct | {incorrect.iloc[0]["n"]} incorrect')
          PY

      - name: Cleanup
        if: always()
        run: rm -f /tmp/gcp-key.json
