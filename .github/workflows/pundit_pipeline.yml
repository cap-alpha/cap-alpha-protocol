name: Pundit Prediction Pipeline

on:
  schedule:
    # Run every 30 minutes during active hours (8am-midnight ET = 12:00-04:00 UTC)
    - cron: '3,33 12-23,0-4 * * *'
    # Run every 2 hours during off-hours
    - cron: '3 5-11 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max articles to extract per run'
        required: false
        default: '50'

# Serialize concurrent scheduled runs so only one pipeline ingest is active at
# a time.  cancel-in-progress: false ensures a slow run is never killed mid-
# chain; the next scheduled run queues behind it instead.
# The application-level optimistic-concurrency guard (ledger_chain_head MERGE)
# provides a second safety layer for manual runs that bypass this lock.
concurrency:
  group: pundit-pipeline
  cancel-in-progress: false

jobs:
  ingest-extract-resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write  # Required for Workload Identity Federation OIDC token request

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install Dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip setuptools wheel
          # nfl-data-py ships pandas<2.0/numpy<2.0 constraints; bypass with --no-deps.
          # The package works at runtime with current numpy/pandas.
          .venv/bin/pip install --no-deps "nfl-data-py>=0.3.3"
          # --prefer-binary avoids source builds entirely (no pkg_resources issues)
          .venv/bin/pip install --prefer-binary -r pipeline/requirements.txt
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Authenticate to GCP (Workload Identity)
        # Preferred path: workload identity federation — no key file written to disk.
        # Falls back to JSON key if vars.WORKLOAD_IDENTITY_PROVIDER is not configured.
        # See GCP setup instructions in issue #709.
        if: vars.WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Authenticate to GCP (JSON key fallback)
        # Legacy fallback used until the Workload Identity Pool is provisioned.
        # Writes the key to a temp file that is cleaned up in the Cleanup step.
        # Shell injection risk is mitigated by single-quoting the expansion so
        # the shell never interprets the JSON content.
        if: vars.WORKLOAD_IDENTITY_PROVIDER == ''
        run: |
          echo '${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}' > /tmp/gcp-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json" >> $GITHUB_ENV

      - name: Apply pending migrations
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          PYTHONPATH: ${{ github.workspace }}/pipeline
          GITHUB_SHA: ${{ github.sha }}
        run: |
          cd pipeline
          python3 scripts/apply_migrations.py

      - name: Ingest new articles
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          PYTHONPATH: ${{ github.workspace }}/pipeline
        run: |
          cd pipeline
          python3 -m src.media_ingestor

      - name: Seed pundit registry
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          PYTHONPATH: ${{ github.workspace }}/pipeline
        run: |
          cd pipeline
          python3 -m scripts.seed_pundit_registry

      - name: Extract predictions
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}/pipeline
          # CI provenance — written to silver_v2_claims.extraction_run by run_extraction()
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          cd pipeline
          python3 -m src.assertion_extractor --limit ${{ github.event.inputs.limit || '50' }} --include-unmatched

      - name: Verify extraction produced output
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          PYTHONPATH: ${{ github.workspace }}/pipeline
        run: |
          cd pipeline
          python3 scripts/check_extraction_health.py --window-minutes 120 --min-count 1

      - name: Refresh SportsDataIO draft data
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          SPORTS_DATA_IO_API_KEY: ${{ secrets.SPORTS_DATA_IO_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}/pipeline
        run: |
          cd pipeline
          python3 -c "from src.sportsdataio_client import ingest_bronze_players; ingest_bronze_players()"

      - name: Resolve predictions
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          PYTHONPATH: ${{ github.workspace }}/pipeline
        run: |
          cd pipeline
          python3 -m src.resolve_daily

      - name: Report status
        if: always()
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          PYTHONPATH: ${{ github.workspace }}/pipeline
        run: |
          cd pipeline
          python3 - <<'PY'
          from src.db_manager import DBManager
          db = DBManager()
          total = db.fetch_df('SELECT COUNT(*) as n FROM gold_layer.prediction_ledger')
          pending = db.fetch_df("SELECT COUNT(*) as n FROM gold_layer.prediction_ledger WHERE resolution_status = 'PENDING'")
          correct = db.fetch_df("SELECT COUNT(*) as n FROM gold_layer.prediction_resolutions WHERE resolution_status = 'CORRECT'")
          incorrect = db.fetch_df("SELECT COUNT(*) as n FROM gold_layer.prediction_resolutions WHERE resolution_status = 'INCORRECT'")
          print(f'Pipeline complete: {total.iloc[0]["n"]} total | {pending.iloc[0]["n"]} pending | {correct.iloc[0]["n"]} correct | {incorrect.iloc[0]["n"]} incorrect')
          PY

      - name: Cleanup
        if: always()
        run: rm -f /tmp/gcp-key.json
