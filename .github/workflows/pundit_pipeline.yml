name: Pundit Prediction Pipeline

on:
  schedule:
    # Run every 60 minutes during active hours (8am-midnight ET = 12:00-04:00 UTC).
    # Previously every 30 min; reduced to limit queue churn when the self-hosted
    # runner is offline (each trigger cancels the previous queued-but-never-started
    # run, creating a cascade of cancellations with no useful work done).
    - cron: '3 12-23,0-4 * * *'
    # Run every 2 hours during off-hours
    - cron: '3 5-11 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max articles to extract per run'
        required: false
        default: '50'

# Serialize concurrent scheduled runs so only one pipeline ingest is active at
# a time.  cancel-in-progress: false ensures a slow run is never killed mid-
# chain; the next scheduled run queues behind it instead.
# The application-level optimistic-concurrency guard (ledger_chain_head MERGE)
# provides a second safety layer for manual runs that bypass this lock.
concurrency:
  group: pundit-pipeline
  cancel-in-progress: false

jobs:
  ingest-extract-resolve:
    runs-on: self-hosted
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write  # Required for Workload Identity Federation OIDC token request

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Verify Ollama + models
        run: |
          curl -sf http://localhost:11434/api/tags | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          models = [m['name'] for m in data.get('models', [])]
          needed = 'qwen2.5:32b'
          if not any(needed in m for m in models):
              print(f'ERROR: {needed} not found. Run: ollama pull qwen2.5:32b')
              sys.exit(1)
          print(f'Ollama ready. Models: {models}')
          "

      - name: Check AC power
        id: power
        run: |
          STATUS=$(system_profiler SPPowerDataType 2>/dev/null | grep "Currently in Use" | head -1 || true)
          if echo "$STATUS" | grep -q "No"; then
            echo "on_battery=true" >> $GITHUB_OUTPUT
          else
            echo "on_battery=false" >> $GITHUB_OUTPUT
          fi

      - name: Skip on battery
        if: steps.power.outputs.on_battery == 'true'
        run: |
          echo "On battery — skipping extraction to preserve battery life"
          exit 0

      - name: Install Dependencies
        run: |
          VENV_DIR="$HOME/.venv/cap-alpha"
          python3 -m venv "$VENV_DIR"
          "$VENV_DIR/bin/pip" install --upgrade pip setuptools wheel
          # Install numpy/pandas FIRST so no conflicting package is present
          # when pip resolves constraints.  pandas 2.2.x has no cp314 wheels;
          # pandas 3.0+ does — binary install, no source build needed.
          "$VENV_DIR/bin/pip" install "numpy>=2.0" "pandas>=3.0"
          # Install nfl-data-py without its declared deps AFTER numpy/pandas.
          # --no-deps skips the dependency conflict check, so pip does not
          # exit 1 due to nfl-data-py declaring numpy<2.0 / pandas<2.0.
          # (The package works at runtime with numpy 2.x and pandas 3.x.)
          "$VENV_DIR/bin/pip" install --no-deps "nfl-data-py>=0.3.3"
          # Install the rest of requirements (numpy/pandas already satisfied).
          # --no-build-isolation for packages like shap/numba that may still
          # need a source build on Python 3.14.
          "$VENV_DIR/bin/pip" install -r pipeline/requirements.txt --no-build-isolation
          echo "VENV_DIR=$HOME/.venv/cap-alpha" >> $GITHUB_ENV
          echo "$HOME/.venv/cap-alpha/bin" >> $GITHUB_PATH

      - name: Authenticate to GCP (Workload Identity)
        # Preferred path: workload identity federation — no key file written to disk.
        # Falls back to JSON key if vars.WORKLOAD_IDENTITY_PROVIDER is not configured.
        # See GCP setup instructions in issue #709.
        if: vars.WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Authenticate to GCP (JSON key fallback)
        # Legacy fallback used until the Workload Identity Pool is provisioned.
        # Writes the key to a temp file that is cleaned up in the Cleanup step.
        # Shell injection risk is mitigated by single-quoting the expansion so
        # the shell never interprets the JSON content.
        if: vars.WORKLOAD_IDENTITY_PROVIDER == ''
        run: |
          echo '${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}' > /tmp/gcp-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json" >> $GITHUB_ENV

      - name: Apply pending migrations
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          PYTHONPATH: ${{ github.workspace }}/pipeline
          GITHUB_SHA: ${{ github.sha }}
        run: |
          source "$VENV_DIR/bin/activate"
          cd pipeline
          python3 scripts/apply_migrations.py

      - name: Ingest new articles
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          PYTHONPATH: ${{ github.workspace }}/pipeline
        run: |
          source "$VENV_DIR/bin/activate"
          cd pipeline
          python3 -m src.media_ingestor

      - name: Seed pundit registry
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          PYTHONPATH: ${{ github.workspace }}/pipeline
        run: |
          source "$VENV_DIR/bin/activate"
          cd pipeline
          python3 -m scripts.seed_pundit_registry

      - name: Extract predictions
        if: steps.power.outputs.on_battery != 'true'
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          PYTHONPATH: ${{ github.workspace }}/pipeline
          # CI provenance — written to silver_v2_claims.extraction_run by run_extraction()
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          source "$VENV_DIR/bin/activate"
          cd pipeline
          python3 -m src.assertion_extractor --limit ${{ github.event.inputs.limit || '50' }} --include-unmatched

      - name: Verify extraction produced output
        if: steps.power.outputs.on_battery != 'true'
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-key.json
          PYTHONPATH: ${{ github.workspace }}/pipeline
        run: |
          source "$VENV_DIR/bin/activate"
          cd pipeline
          python3 scripts/check_extraction_health.py --window-minutes 120 --min-count 1

      - name: Refresh SportsDataIO draft data
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          SPORTS_DATA_IO_API_KEY: ${{ secrets.SPORTS_DATA_IO_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}/pipeline
        run: |
          source "$VENV_DIR/bin/activate"
          cd pipeline
          python3 -c "from src.sportsdataio_client import ingest_bronze_players; ingest_bronze_players()"

      - name: Resolve predictions
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          PYTHONPATH: ${{ github.workspace }}/pipeline
        run: |
          source "$VENV_DIR/bin/activate"
          cd pipeline
          python3 -m src.resolve_daily

      - name: Report status
        if: always()
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          PYTHONPATH: ${{ github.workspace }}/pipeline
        run: |
          source "$VENV_DIR/bin/activate"
          cd pipeline
          python3 - <<'PY'
          from src.db_manager import DBManager
          db = DBManager()
          total = db.fetch_df('SELECT COUNT(*) as n FROM gold_layer.prediction_ledger')
          pending = db.fetch_df("SELECT COUNT(*) as n FROM gold_layer.prediction_ledger WHERE resolution_status = 'PENDING'")
          correct = db.fetch_df("SELECT COUNT(*) as n FROM gold_layer.prediction_resolutions WHERE resolution_status = 'CORRECT'")
          incorrect = db.fetch_df("SELECT COUNT(*) as n FROM gold_layer.prediction_resolutions WHERE resolution_status = 'INCORRECT'")
          print(f'Pipeline complete: {total.iloc[0]["n"]} total | {pending.iloc[0]["n"]} pending | {correct.iloc[0]["n"]} correct | {incorrect.iloc[0]["n"]} incorrect')
          PY

      - name: Cleanup
        if: always()
        run: rm -f /tmp/gcp-key.json
