name: Regen Leaderboard Snapshot

# Daily regen of web/lib/data/leaderboard-snapshot.json so the homepage
# never goes stale. Runs on GitHub-hosted ubuntu (not the self-hosted
# runner) to stay independent of the pipeline workflow's health.
#
# Opens a PR when the snapshot changes (branch protection forbids direct
# pushes to main). The PR reuses a single branch — successive regens
# update the same PR rather than piling up duplicates. Skips the PR
# step entirely when there is no diff.

on:
  schedule:
    # Twice daily: 13:00 UTC (06:00 PT morning) and 01:00 UTC (18:00 PT evening)
    - cron: '0 13 * * *'
    - cron: '0 1 * * *'
  workflow_dispatch:

concurrency:
  group: regen-leaderboard-snapshot
  cancel-in-progress: false

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-cloud-bigquery db-dtypes pandas

      - name: Authenticate to GCP (Workload Identity)
        if: vars.WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Authenticate to GCP (JSON key fallback)
        if: vars.WORKLOAD_IDENTITY_PROVIDER == ''
        run: |
          echo '${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}' > /tmp/gcp-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json" >> $GITHUB_ENV

      - name: Regenerate snapshot
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          PYTHONPATH: ${{ github.workspace }}/pipeline
        run: |
          python pipeline/scripts/regen_leaderboard_snapshot.py

      - name: Detect snapshot diff
        id: diff
        run: |
          if git diff --quiet web/lib/data/leaderboard-snapshot.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No snapshot changes — skipping PR creation."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute snapshot stats
        if: steps.diff.outputs.changed == 'true'
        id: stats
        run: |
          STATS=$(python3 -c "
          import json
          d = json.load(open('web/lib/data/leaderboard-snapshot.json'))
          p = d.get('pundits', [])
          print(f\"pundits={len(p)} predictions={sum(x.get('total_predictions',0) for x in p)} resolved={sum(x.get('resolved_predictions',0) for x in p)} correct={sum(x.get('correct_predictions',0) for x in p)}\")
          ")
          echo "summary=${STATS}" >> "$GITHUB_OUTPUT"

      - name: Create or update PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            chore(snapshot): scheduled leaderboard snapshot regen

            ${{ steps.stats.outputs.summary }}
          title: "chore(snapshot): scheduled leaderboard snapshot regen"
          body: |
            Automated regen of `web/lib/data/leaderboard-snapshot.json`.

            **Snapshot summary:** ${{ steps.stats.outputs.summary }}

            This PR is updated in place on every scheduled run that produces
            a diff. Safe to rebase + auto-merge once CI is green.
          branch: chore/leaderboard-snapshot
          delete-branch: true
          add-paths: web/lib/data/leaderboard-snapshot.json
          labels: |
            automated
            snapshot

      - name: Cleanup
        if: always()
        run: rm -f /tmp/gcp-key.json
