name: Address and resolve Copilot review threads

# Fires when Copilot submits a PR review. Claude Code reads every open thread,
# applies the minimal correct fix for each, then resolves the threads so
# auto_approve.yml can fire and kinghrothgar-dev can approve for merge queue.

on:
  pull_request_review:
    types: [submitted]

jobs:
  address-and-resolve:
    if: github.event.review.user.login == 'copilot-pull-request-reviewer[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
      id-token: write
      actions: read

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.KINGHROTHGAR_DEV_PAT }}

      - name: Address Copilot review with Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          prompt: |
            Copilot has just reviewed PR #${{ github.event.pull_request.number }} and left review comments.

            Your job: address every open Copilot review thread with a minimal, correct fix.
            - Read each thread comment carefully.
            - Make the smallest change that satisfies the feedback.
            - Do not refactor unrelated code or change behaviour outside the thread's scope.
            - After fixing all issues, commit the changes with message: "fix(review): address Copilot review on PR #${{ github.event.pull_request.number }}"
            - Then resolve each Copilot thread via the resolveReviewThread GraphQL mutation.
            - If a thread raises a valid concern but the fix would be a separate PR (e.g. a larger refactor), reply to the thread explaining why, then resolve it.
            - Run the relevant tests after applying fixes and confirm they pass before committing.

      - name: Resolve any remaining open Copilot threads
        env:
          GH_TOKEN: ${{ secrets.KINGHROTHGAR_DEV_PAT }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          THREAD_IDS=$(gh api graphql \
            -f owner="$OWNER" \
            -f repo="$REPO" \
            -F prNumber="$PR_NUMBER" \
            -f query='
              query($owner:String!, $repo:String!, $prNumber:Int!) {
                repository(owner:$owner, name:$repo) {
                  pullRequest(number:$prNumber) {
                    reviewThreads(first:50) {
                      nodes {
                        id isResolved
                        comments(first:1) { nodes { author { login } } }
                      }
                    }
                  }
                }
              }
            ' \
            --jq '.data.repository.pullRequest.reviewThreads.nodes[]
                  | select(.isResolved == false
                    and (.comments.nodes[0].author.login | startswith("copilot")))
                  | .id')

          if [ -z "$THREAD_IDS" ]; then
            echo "All Copilot threads already resolved"
            exit 0
          fi

          while IFS= read -r tid; do
            [ -z "$tid" ] && continue
            echo "Resolving thread $tid"
            gh api graphql \
              -f threadId="$tid" \
              -f query='mutation($threadId:ID!){resolveReviewThread(input:{threadId:$threadId}){thread{id isResolved}}}'
          done <<< "$THREAD_IDS"

          echo "Done — all Copilot threads resolved"
