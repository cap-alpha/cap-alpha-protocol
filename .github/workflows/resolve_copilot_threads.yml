name: Resolve Copilot review threads

on:
  pull_request_review:
    types: [submitted]

jobs:
  resolve-copilot-threads:
    if: github.event.review.user.login == 'copilot-pull-request-reviewer[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Resolve all Copilot review threads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPO" != "$THIS_REPO" ]; then
            echo "PR #$PR_NUMBER is from fork — skipping"
            exit 0
          fi

          THREAD_IDS=$(gh api graphql \
            -f owner="$OWNER" \
            -f repo="$REPO" \
            -F prNumber="$PR_NUMBER" \
            -f query='
              query($owner: String!, $repo: String!, $prNumber: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $prNumber) {
                    reviewThreads(first: 50) {
                      nodes { id isResolved }
                    }
                  }
                }
              }
            ' \
            --jq '.data.repository.pullRequest.reviewThreads.nodes[]
                  | select(.isResolved == false)
                  | .id')

          if [ -z "$THREAD_IDS" ]; then
            echo "No unresolved threads"
            exit 0
          fi

          while IFS= read -r tid; do
            [ -z "$tid" ] && continue
            gh api graphql \
              -f threadId="$tid" \
              -f query='mutation($threadId: ID!) {
                resolveReviewThread(input: {threadId: $threadId}) {
                  thread { id isResolved }
                }
              }'
            echo "Resolved $tid"
          done <<< "$THREAD_IDS"
