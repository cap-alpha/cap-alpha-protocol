name: Data Quality Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  # Merge queue — re-runs CI on the combined state of queued PRs before landing on main
  merge_group:
    branches: [ main ]

jobs:
  test:
    name: Run Data Quality Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r pipeline/requirements.txt
        pip install pytest pytest-cov
    
    - name: Run pytest tests
      run: |
        pytest pipeline/tests/ -v --tb=short --cov=pipeline/src --cov-report=term-missing --cov-report=xml \
          --ignore=pipeline/tests/test_api.py \
          --ignore=pipeline/tests/test_api_vegas.py \
          -m "not integration"
      env:
        PYTHONPATH: ${{ github.workspace }}/pipeline

    - name: Validate cryptographic ledger chain integrity
      # Explicitly targets chain-hash unit tests (no BigQuery required — mocked).
      # Runs with -x to fail fast on the first broken chain invariant.
      # Blocks merge if any chain hash computation or verification logic is broken.
      run: |
        pytest pipeline/tests/test_cryptographic_ledger.py -x -v --tb=short \
          -k "not Integration"
      env:
        PYTHONPATH: ${{ github.workspace }}/pipeline

    - name: Upload coverage reports
      if: always()
      uses: codecov/codecov-action@v6
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install ruff

    - name: Lint with ruff
      run: |
        ruff check pipeline/src/ pipeline/tests/
        ruff format --check pipeline/src/ pipeline/tests/

  dbt_test:
    name: dbt Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install dbt-core dbt-duckdb
    
    - name: Create DuckDB database
      run: |
        mkdir -p dbt
        touch dbt/nfl_dead_money.duckdb
    
    - name: Run dbt deps
      run: |
        cd dbt && dbt deps --project-dir . --profiles-dir .
      continue-on-error: true
    
    - name: Run dbt compile
      run: |
        cd dbt && dbt compile --project-dir . --profiles-dir .
      continue-on-error: true
    
    - name: Run dbt test
      run: |
        cd dbt && dbt test --project-dir . --profiles-dir .
      continue-on-error: true

  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for web/* changes
        id: filter
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            # fetch-depth: 0 above already fetches full history; fetching BASE
            # without --depth=1 ensures it's never grafted shallow, which would
            # break the three-dot merge-base calculation below.
            git fetch origin "$BASE" 2>/dev/null || true
            # Three-dot diff: compares from merge-base(BASE, HEAD) to HEAD, so only
            # files the PR itself changed are counted, not files that diverged from
            # main (e.g. new files added to main that aren't in a stale PR branch).
            CHANGED=$(git diff --name-only "$BASE"..."$HEAD" 2>/dev/null || echo "")
          elif [[ "${{ github.event_name }}" == "merge_group" ]]; then
            BASE="${{ github.event.merge_group.base_sha }}"
            CHANGED=$(git diff --name-only "$BASE"...HEAD 2>/dev/null || echo "")
          else
            # push to main — always run E2E on direct pushes
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "web/placeholder")
          fi
          echo "Changed files:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -q "^web/"; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi

  e2e_test:
    name: Run E2E Integration Tests (Docker) [advisory]
    needs: [changes]
    # Only run when web/** files change — avoids flaky failures on backend-only PRs
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    continue-on-error: true  # advisory — failures are tracked but do not block merge

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Run Playwright Tests
      run: |
        # Explicitly pass required environment variables to the web container
        # Run tests via the existing docker-compose.test.yml setup
        export NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}"
        export CLERK_SECRET_KEY="${{ secrets.CLERK_SECRET_KEY }}"
        export GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"
        docker compose -f docker-compose.yml -f docker-compose.test.yml --env-file /dev/null run --rm e2e
