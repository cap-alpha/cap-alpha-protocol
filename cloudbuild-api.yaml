steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile.api'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/pundit-ledger/api:$BUILD_ID'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/pundit-ledger/api:latest'
      - '.'
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/pundit-ledger/api'
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'pundit-ledger-api'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/pundit-ledger/api:$BUILD_ID'
      - '--region'
      - 'us-central1'
      - '--service-account'
      - 'pundit-api@$PROJECT_ID.iam.gserviceaccount.com'
      - '--allow-unauthenticated'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '10'
      - '--concurrency'
      - '80'
      - '--timeout'
      - '60'
      - '--set-env-vars'
      - 'GCP_PROJECT_ID=$PROJECT_ID'
images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/pundit-ledger/api:latest'
options:
  logging: CLOUD_LOGGING_ONLY
