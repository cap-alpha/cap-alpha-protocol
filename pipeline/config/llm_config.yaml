# LLM Provider Configuration
#
# Controls which LLM backend the assertion extractor uses.
# Switch providers by changing the `provider` field — no code changes needed.
#
# Available providers: gemini, claude, openai, ollama
#
# Environment variables required per provider:
#   gemini:  GEMINI_API_KEY
#   claude:  ANTHROPIC_API_KEY
#   openai:  OPENAI_API_KEY
#   ollama:  none (local, optionally OLLAMA_BASE_URL)
#
# Cloud runner strategy (2026-06, issue #1089):
#   Pipeline runs on ubuntu-latest GitHub-hosted runners.
#   Gemini Flash handles extraction — eliminates mac-local runner SPOF.
#   Required secret: GEMINI_API_KEY in GitHub Actions.

# Primary extraction (full claim extraction)
extraction:
  provider: gemini              # gemini | claude | openai | ollama
  model: gemini-2.5-flash       # provider-specific model ID; overridden by LLM_EXTRACTION_MODEL env var
  timeout: 120
  temperature: 0.1
  rate_limit_seconds: 1.0       # Gemini paid tier ~1000 RPM; overridden by LLM_EXTRACTION_RATE_LIMIT env var
  # gemini models: gemini-2.5-flash (fast+cheap), gemini-2.5-pro (highest quality)
  # claude models: claude-sonnet-4-6, claude-haiku-4-5-20251001
  # openai models: gpt-4o, gpt-4o-mini
  # ollama models: qwen2.5:32b (local only, requires mac-local runner)

# Triage pass (fast relevance filter before extraction)
triage:
  provider: gemini
  model: gemini-2.5-flash
  timeout: 30
  temperature: 0.0
  enabled: true                 # set false to disable triage pre-filter

# Legacy filter config — kept for backward compat with existing tests
filter:
  enabled: false                # use triage block above instead
  provider: gemini
  model: gemini-2.5-flash

# Fallback — disabled
fallback:
  enabled: false

# Team batching (#181)
batching:
  enabled: false                # set true to enable team-batching
  max_articles_per_batch: 5
  article_truncate_chars: 1500
