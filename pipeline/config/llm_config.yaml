# LLM Provider Configuration
#
# Controls which LLM backend the assertion extractor uses.
# Switch providers by changing the `provider` field — no code changes needed.
#
# Available providers: gemini, claude, openai, ollama
#
# Environment variables required per provider:
#   gemini:  GEMINI_API_KEY
#   claude:  ANTHROPIC_API_KEY
#   openai:  OPENAI_API_KEY
#   ollama:  none (local, optionally OLLAMA_BASE_URL)
#
# Provider strategy (2026-06, issue #1089):
#   Local dev: Ollama (offline, zero cloud cost) — default in this file.
#   CI / production: Gemini Flash — overridden via env vars in GitHub Actions:
#     LLM_EXTRACTION_PROVIDER=gemini LLM_EXTRACTION_MODEL=gemini-2.5-flash
#   This keeps unit tests (which assert Ollama default) and local dev intact.

# Primary extraction (full claim extraction)
extraction:
  provider: ollama              # gemini | claude | openai | ollama; overridden by LLM_EXTRACTION_PROVIDER env var
  model: qwen2.5:32b            # provider-specific model ID; overridden by LLM_EXTRACTION_MODEL env var
  base_url: http://localhost:11434
  timeout: 120
  temperature: 0.1
  rate_limit_seconds: 0.0       # no rate limiting for local inference; overridden by LLM_EXTRACTION_RATE_LIMIT env var
  # gemini models: gemini-2.5-flash (fast+cheap), gemini-2.5-pro (highest quality)
  # claude models: claude-sonnet-4-6, claude-haiku-4-5-20251001
  # openai models: gpt-4o, gpt-4o-mini
  # ollama models: qwen2.5:32b, qwen2.5:7b

# Triage pass (fast relevance filter before extraction)
triage:
  provider: ollama
  model: qwen2.5:7b
  base_url: http://localhost:11434
  timeout: 30
  temperature: 0.0
  enabled: true                 # set false to disable triage pre-filter

# Legacy filter config — kept for backward compat with existing tests
filter:
  enabled: false                # use triage block above instead
  provider: ollama
  model: qwen2.5:7b

# Fallback — disabled
fallback:
  enabled: false

# Team batching (#181)
batching:
  enabled: false                # set true to enable team-batching
  max_articles_per_batch: 5
  article_truncate_chars: 1500
