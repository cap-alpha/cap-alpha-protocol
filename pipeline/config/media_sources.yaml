# Media Sources Registry — Pundit Prediction Ingestion
#
# Each source defines where to fetch pundit content and how to identify it.
# The daily ingestor iterates over all enabled sources, fetches new content,
# and lands it in bronze_layer.raw_pundit_media.
#
# Adding a new source: just add an entry here. No code changes needed.
# sport field: NFL|MLB|NBA|NHL|NCAAF|NCAAB — defaults to NFL if omitted.

sources:
  # ── NFL RSS Feeds ───────────────────────────────────────────────────────────
  - id: pft_nbc
    name: "ProFootballTalk (NBC)"
    sport: "NFL"
    type: rss
    scrape_full_text: true
    url: "https://profootballtalk.nbcsports.com/feed/"
    enabled: true
    priority_tier: 3  # Tier 3: news wire/breaking-news source; low prediction density
    default_pundit:
      id: pft_staff
      name: "PFT Staff"
    pundits:
      - id: mike_florio
        name: "Mike Florio"
        match_authors: ["Mike Florio", "mflorio"]
      - id: josh_alper
        name: "Josh Alper"
        match_authors: ["Josh Alper"]
      - id: michael_david_smith
        name: "Michael David Smith"
        match_authors: ["Michael David Smith"]
      - id: charean_williams
        name: "Charean Williams"
        match_authors: ["Charean Williams"]
      - id: myles_simmons
        name: "Myles Simmons"
        match_authors: ["Myles Simmons"]

  - id: espn_nfl
    name: "ESPN NFL"
    sport: "NFL"
    type: rss
    scrape_full_text: true
    url: "https://www.espn.com/espn/rss/nfl/news"
    enabled: true
    priority_tier: 2  # Tier 2: ESPN mix of analysis + news; medium prediction density
    default_pundit:
      id: espn_nfl_staff
      name: "ESPN NFL Staff"
    pundits:
      - id: adam_schefter
        name: "Adam Schefter"
        match_authors: ["Adam Schefter", "Schefter"]
      - id: dan_graziano
        name: "Dan Graziano"
        match_authors: ["Dan Graziano"]
      - id: jeremy_fowler
        name: "Jeremy Fowler"
        match_authors: ["Jeremy Fowler"]
      - id: field_yates
        name: "Field Yates"
        match_authors: ["Field Yates"]
      - id: matt_bowen
        name: "Matt Bowen"
        match_authors: ["Matt Bowen"]

  # theringer_nfl removed: returns HTML not XML (permanently dead — 2026-05)

  - id: theathletic_nfl
    name: "The Athletic NFL"
    sport: "NFL"
    type: rss
    # Disabled: ?sport=football returns all sports (soccer, NHL, NBA, tennis, cycling).
    # Re-enable once a working NFL-only feed URL is confirmed. (#128)
    url: "https://theathletic.com/feeds/rss/news/?sport=football"
    enabled: true
    priority_tier: 1  # Tier 1: The Athletic long-form analysis; high prediction density
    default_pundit:
      id: athletic_nfl_staff
      name: "The Athletic NFL Staff"
    # Feed may include non-NFL content; keyword_filter skips entries lacking these terms
    keyword_filter:
      - "NFL"
      - "football"
      - "quarterback"
      - "touchdown"
      - "draft"
      - "free agent"
      - "trade"
      - "roster"
      - "coach"
      - "playoff"
      - "Super Bowl"
      - "AFC"
      - "NFC"
    pundits:
      - id: dianna_russini
        name: "Dianna Russini"
        match_authors: ["Dianna Russini"]
      - id: jeff_howe
        name: "Jeff Howe"
        match_authors: ["Jeff Howe"]

  # nfl_official removed: malformed XML from ad injection (permanently dead — 2026-05)
  # si_nfl removed: malformed XML (permanently dead — 2026-05)

  # ── NFL YouTube Channels ────────────────────────────────────────────────────
  # On self-hosted runner with home IP, YouTube transcript fetching works without
  # the rate-limiting that blocks GitHub-hosted ubuntu-latest runners.
  # Requires yt-dlp (brew install yt-dlp) — works on self-hosted home IP runner
  - id: pat_mcafee_show
    name: "The Pat McAfee Show"
    sport: "NFL"
    type: youtube_transcript
    url: "https://www.youtube.com/feeds/videos.xml?channel_id=UCxcTeAKWJca6XyJ37_ZoKIQ"
    enabled: true
    priority_tier: 1  # yield_rate=0.45 (135/299 articles) — high-yield pundit show
    pundits:
      - id: pat_mcafee
        name: "Pat McAfee"
        match_authors: ["Pat McAfee"]

  # Requires yt-dlp (brew install yt-dlp)
  - id: undisputed
    name: "Undisputed"
    sport: "NFL"
    type: youtube_transcript
    # Disabled: channel_id UCuF2PqOvMBKBVi9JvtC3GqA returns 404 — channel no longer
    # exists. Skip Bayless left FS1/Undisputed in 2023. (#171)
    url: "https://www.youtube.com/feeds/videos.xml?channel_id=UCuF2PqOvMBKBVi9JvtC3GqA"
    enabled: false
    priority_tier: 1  # Opinion/debate show — expected high yield when re-enabled
    pundits:
      - id: skip_bayless
        name: "Skip Bayless"
        match_authors: ["Skip Bayless"]

  # Requires yt-dlp (brew install yt-dlp)
  - id: first_take
    name: "First Take"
    sport: "NFL"
    type: youtube_rss
    # Disabled: UCEjOSbbaOfgnfRODEEMYlCw is an NBA game highlights channel, not the
    # First Take debate/opinion show. Re-enable with correct channel ID. (#128)
    url: "https://www.youtube.com/feeds/videos.xml?channel_id=UCEjOSbbaOfgnfRODEEMYlCw"
    enabled: false  # Disabled: channel is NBA game highlights, not NFL prediction content (#128)
    priority_tier: 1  # Tier 1: First Take debate/opinion show; high prediction density when re-enabled with correct channel
    skip_extraction: true  # wrong channel until #128 resolved; skip extraction to avoid wasting LLM calls
    pundits:
      - id: stephen_a_smith
        name: "Stephen A. Smith"
        match_authors: ["Stephen A. Smith", "Stephen A"]

  # ── Tier 1 YouTube Expansion (issue #129) ──────────────────────────────────
  # Requires yt-dlp (brew install yt-dlp)
  - id: the_herd
    name: "The Herd with Colin Cowherd"
    sport: "NFL"
    type: youtube_transcript
    # Disabled: UCFDidMd82mpDkKijLUqHp7A is the correct channel but only posts
    # YouTube Shorts (clips <60s, no transcripts). Full episodes are on Fox Sports'
    # channel. Re-enable with a full-episode channel ID once confirmed. (#171)
    url: "https://www.youtube.com/feeds/videos.xml?channel_id=UCFDidMd82mpDkKijLUqHp7A"
    enabled: false
    priority_tier: 1  # Opinion show — expected high yield when re-enabled with correct channel
    pundits:
      - id: colin_cowherd
        name: "Colin Cowherd"
        match_authors: ["Colin Cowherd", "Cowherd"]

  # Requires yt-dlp (brew install yt-dlp)
  - id: club_shay_shay
    name: "Club Shay Shay"
    sport: "NFL"
    type: youtube_transcript
    url: "https://www.youtube.com/feeds/videos.xml?channel_id=UCQoxJOkwaCgyzQtiuAIDcuw"
    enabled: true
    priority_tier: 1  # Tier 1: Club Shay Shay interview show; high prediction density when extraction enabled
    skip_extraction: true  # yield_rate=0.00 (0/87 articles) — interview/entertainment content; skip LLM extraction
    pundits:
      - id: shannon_sharpe
        name: "Shannon Sharpe"
        match_authors: ["Shannon Sharpe", "Sharpe"]

