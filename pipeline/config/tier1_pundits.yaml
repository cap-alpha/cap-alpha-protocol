# Tier-1 Pundit List — Published on Launch
#
# Pundits in this list are marked published=TRUE in the pundit_registry table.
# Scores are calculated for all tracked pundits regardless of this flag; only
# published pundits are surfaced via the API and UI.
#
# Criteria for tier-1 inclusion:
#   - Named NFL/NBA beat reporters with national platforms
#   - Minimum track record: established T2+ sourcing reputation
#   - Sufficient historical content to seed the ledger
#
# To mark these pundits published, run:
#   python -m src.publish_tier1_pundits
#
# Issue #830 adjudication decision Q1: 5 resolved claims minimum + published flag.

