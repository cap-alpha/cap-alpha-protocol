[pytest]
# Pytest configuration for NFL Dead Money project

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for organizing tests
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    data_quality: marks tests related to data quality validation
    dbt: marks tests related to dbt models
    validator: marks tests for the dead money validator
    weekly: marks tests as critical for weekly scheduled pipeline runs
    quality_threshold: marks tests as extraction approach-level quality thresholds

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --cov=src
    --cov-fail-under=43
    --cov-report=term-missing

# Coverage options
[coverage:run]
source = src
omit =
    */tests/*
    */__pycache__/*
    */site-packages/*
    # Selenium driver loop — untestable without a live browser; excluded from denominator
    */src/spotrac_scraper_v2.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
precision = 2
